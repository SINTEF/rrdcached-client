name: Cargo Build & Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          #- nightly
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # The image compiles rrdcached from source, so the layers are cached.
      - name: Build the rrdcached image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: rrdcached.Dockerfile
          load: true
          tags: rrdcached:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the rrdcached server
        run: |
          docker run -d --name rrdcached -p 127.0.0.1:42217:42217 rrdcached:ci
          timeout 30 sh -c 'until nc -z localhost 42217; do sleep 0.5; done'
          docker exec rrdcached rrdcached -h 2>&1 | sed -n 1p || true
      - name: Expose the rrdcached server as a unix socket
        run: |
          sudo apt-get update && sudo apt-get install -y socat
          socat UNIX-LISTEN:./rrdcached.sock,reuseaddr,fork TCP:localhost:42217 &
      - name: Test the project
        run: cargo test --verbose
      - name: Show the rrdcached logs
        if: failure()
        run: docker logs rrdcached
